<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Don't Stare At The TV Too Long</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { margin: 0; overflow: hidden; background: #FAF0E6; }
      #scene-container { position: fixed; inset: 0; }

      #landing-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #FAF0E6 0%, #B8D4E8 100%);
        font-family: 'Nunito', sans-serif;
        user-select: none;
      }

      .crt-bg {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.13;
        pointer-events: none;
      }

      .landing-content {
        position: relative;
        text-align: center;
        padding: 2rem;
        max-width: 640px;
      }

      .landing-title {
        font-size: clamp(1.8rem, 5vw, 3.2rem);
        font-weight: 200;
        color: #C4A8BE;
        letter-spacing: 0.12em;
        line-height: 1.2;
        margin-bottom: 1.2rem;
      }

      .landing-subtitle {
        font-size: clamp(0.9rem, 2vw, 1.1rem);
        font-weight: 300;
        color: #9E9E9E;
        letter-spacing: 0.06em;
        margin-bottom: 2.5rem;
      }

      #enter-vr-btn {
        display: inline-block;
        padding: 0.85rem 2.8rem;
        border-radius: 9999px;
        background: #E8B4A0;
        color: #fff;
        font-family: 'Nunito', sans-serif;
        font-size: 1rem;
        font-weight: 400;
        letter-spacing: 0.1em;
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(200, 140, 120, 0.35);
        transition: background 0.2s ease, transform 0.1s ease;
      }

      #enter-vr-btn:hover { background: #D9987A; }
      #enter-vr-btn:active { transform: scale(0.97); }

      .no-webxr-msg {
        font-size: 0.95rem;
        color: #9E9E9E;
        max-width: 300px;
        line-height: 1.6;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>

    <div id="landing-overlay">
      <!-- Decorative CRT silhouette -->
      <div class="crt-bg">
        <svg width="480" height="400" viewBox="0 0 480 400" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- CRT body -->
          <rect x="60" y="40" width="360" height="270" rx="28" fill="#C4A8BE"/>
          <!-- Screen bezel -->
          <rect x="95" y="68" width="290" height="210" rx="16" fill="#C4A8BE"/>
          <!-- Screen face -->
          <rect x="110" y="82" width="260" height="182" rx="10" fill="#B89AB2"/>
          <!-- Antennas -->
          <line x1="170" y1="40" x2="130" y2="2" stroke="#C4A8BE" stroke-width="12" stroke-linecap="round"/>
          <line x1="310" y1="40" x2="350" y2="2" stroke="#C4A8BE" stroke-width="12" stroke-linecap="round"/>
          <!-- Stand -->
          <rect x="150" y="310" width="180" height="48" rx="12" fill="#C4A8BE"/>
          <!-- Base -->
          <rect x="110" y="348" width="260" height="22" rx="8" fill="#B89AB2"/>
          <!-- Control dots -->
          <circle cx="390" cy="155" r="8" fill="#B89AB2"/>
          <circle cx="390" cy="185" r="8" fill="#B89AB2"/>
        </svg>
      </div>

      <div class="landing-content">
        <h1 class="landing-title">Don't Stare At The TV Too Long</h1>
        <p class="landing-subtitle">Put on your headset and press Enter VR</p>
        <button id="enter-vr-btn">Enter VR</button>
      </div>
    </div>

    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
